<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>35 Labs®</title>
<meta name="description" content="Selected film and product work by 35 Labs.">
<style>
:root{
  --bg:#1C1C1C; --ink:#F2F1EC; --mute:#9A9A96; --line:rgba(242,241,236,.22);
  --pad:clamp(16px,2.2vw,32px); --card:clamp(290px,36vw,600px); --gap:clamp(10px,1.2vw,18px);
  --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 35mm grain: noise tile, jittered in steps like frames on a film strip */
body::after{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;z-index:50;pointer-events:none;
  opacity:var(--grain,.17);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(1) infinite}
@keyframes grain{
  0%{transform:translate(0,0)} 12%{transform:translate(-6%,4%)} 25%{transform:translate(5%,-7%)}
  37%{transform:translate(-4%,-3%)} 50%{transform:translate(7%,5%)} 62%{transform:translate(-8%,2%)}
  75%{transform:translate(3%,8%)} 87%{transform:translate(-2%,-6%)}}

/* Header */
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:var(--pad);background:linear-gradient(var(--bg) 55%,transparent)}
.brand{font-weight:600;letter-spacing:.02em}
nav{display:flex;align-items:center;gap:clamp(18px,3vw,44px)}
nav a{position:relative}
nav a:not(.cta)::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav a:not(.cta):hover::after{transform:scaleX(1)}
.cta{padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg);transition:opacity .2s}
.cta:hover{opacity:.8}
.menu{display:none;background:none;border:0;font:inherit;cursor:pointer;color:inherit}

/* Works reel */
#works{padding-top:calc(var(--pad)*2 + 24px);min-height:100svh;display:flex;align-items:center}
.reel{width:100%;overflow:hidden}
.track{display:flex;width:max-content;animation:slide var(--dur,60s) linear infinite}
.reel:hover .track,.reel:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.card{display:block;width:var(--card);margin-right:var(--gap);flex:none}
.media{position:relative;aspect-ratio:16/9;overflow:hidden;background:hsl(var(--h) 14% 62%);border-radius:2px}
.media::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 30% 20%,hsl(var(--h) 30% 78%),transparent 60%),
  linear-gradient(160deg,hsl(var(--h) 18% 58%),hsl(calc(var(--h) + 30) 22% 28%))}
.media video,.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .media video,.card:hover .media img{transform:scale(1.04)}
.cap{display:flex;justify-content:space-between;gap:12px;padding-top:10px}
.cap span:last-child{color:var(--mute);text-align:right}

/* Contact dialog */
.contact{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);margin:auto;padding:0;border:1px solid var(--line);border-radius:10px;background:#242424;color:var(--ink)}
.contact::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.contact form{position:relative;display:flex;flex-direction:column;gap:8px;padding:28px}
.contact h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.ct-sub{margin-bottom:10px;color:var(--mute)}
.contact label{margin-top:6px;font-size:12px;color:var(--mute)}
.contact input,.contact textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;outline:0;background:#1C1C1C;color:var(--ink);font:inherit;font-size:15px;resize:vertical}
.contact input:focus,.contact textarea:focus{border-color:var(--ink)}
.ct-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.ct-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.ct-row .cta{border:0;font:inherit;cursor:pointer}
.ct-row .cta:disabled{opacity:.5;cursor:default}
#ctStatus{font-size:13px;color:var(--mute)}
#ctStatus.err{color:#ff9a8f}
#ctStatus a{color:var(--ink);text-decoration:underline}
.ct-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--mute);font:inherit;font-size:22px;line-height:1;cursor:pointer}
.ct-x:hover{color:var(--ink)}

/* Notices */
.toast{position:fixed;left:50%;bottom:20px;z-index:70;max-width:min(560px,calc(100vw - 32px));padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#2a2a2a;color:var(--ink);font-size:13px;line-height:1.45;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vnote{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;background:rgba(0,0,0,.6);color:var(--ink);font-size:13px;line-height:1.45;pointer-events:none}

/* Fullscreen video viewer */
.card .media video{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#000}
.lb[hidden]{display:none}
.lb video{width:100%;height:100%;object-fit:contain;background:#000}
.lb-x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;z-index:1;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#F2F1EC;font:inherit;font-size:24px;line-height:1;cursor:pointer}
.lb-x:hover{background:rgba(242,241,236,.2)}

/* Video upload controls on the main box */
.box{position:relative}
.box.over .media{outline:2px solid var(--ink);outline-offset:-2px}
.vctl{position:absolute;top:0;left:0;right:0;aspect-ratio:16/9;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-start;gap:6px;padding:8px}
.vctl button{pointer-events:auto;font:inherit;cursor:pointer;border:0;padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--ink);opacity:0;transition:opacity .2s}
.box:hover .vctl button,.vctl:focus-within button{opacity:1}
.vctl .vempty{position:absolute;inset:0;padding:0;border-radius:2px;background:rgba(0,0,0,.2);color:#F2F1EC;opacity:1}
.vctl .vempty:hover{background:rgba(0,0,0,.34)}
@media (hover:none){.vctl button{opacity:1}}

/* 16:4 image strip under each project */
.link{display:block}
.strip{position:relative;display:flex;aspect-ratio:16/4;margin-top:var(--gap);border:1px dashed var(--line);border-radius:2px;overflow:hidden;transition:background .2s,border-color .2s}
.strip.has{border-style:solid}
.strip.hide{display:none}
.strip.over{border-color:var(--ink);background:rgba(242,241,236,.07)}
.strip .imgs{display:flex;gap:4px;width:100%;height:100%;overflow-x:auto;scrollbar-width:none}
.strip .imgs::-webkit-scrollbar{display:none}
.strip img{height:100%;width:auto;flex:none;object-fit:cover}
.strip button{font:inherit;cursor:pointer;border:0;color:var(--mute);background:none}
.strip .add{position:absolute;inset:0}
.strip.has .add,.strip .clr{inset:auto;position:absolute;bottom:6px;padding:5px 11px;border-radius:999px;background:var(--bg);color:var(--ink);opacity:0;transition:opacity .2s}
.strip.has .add{right:6px}
.strip .clr{left:6px}
.strip.has:hover .add,.strip.has:hover .clr,.strip:focus-within .add,.strip:focus-within .clr{opacity:1}
@media (hover:none){.strip.has .add,.strip .clr{opacity:1}}

/* About + footer */
#about{padding:clamp(64px,10vw,140px) var(--pad) var(--pad)}
.logo img{display:block;margin-inline:auto;width:min(100%,max(82vw,520px));height:auto;mix-blend-mode:lighten}
.about{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);margin-top:clamp(28px,4vw,56px)}
.about p{max-width:46ch;font-size:clamp(15px,1.25vw,18px);line-height:1.45}
.about .side{display:flex;flex-direction:column;align-items:flex-start;gap:14px;justify-self:end}

@media (max-width:720px){
  .menu{display:block}
  nav{position:fixed;inset:0;flex-direction:column;justify-content:center;gap:22px;background:var(--bg);font-size:28px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  nav.open{opacity:1;visibility:visible}
  nav .cta{font-size:16px;margin-top:8px}
  header{z-index:30}
  .about{grid-template-columns:1fr}
  .about .side{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .track,body::after{animation:none}
  .reel{overflow-x:auto}
}
</style>
</head>

    <div class="side">
      <a class="cta" id="mailCta2" href="#">Start a project</a>
    </div>
  </div>
</footer>

<dialog class="contact" id="contact" aria-labelledby="ctTitle">
  <form id="ctForm">
    <button class="ct-x" type="button" aria-label="Close" data-close>&times;</button>
    <h2 id="ctTitle">Get in touch</h2>
    <p class="ct-sub">Tell us about your project. We’ll reply by email.</p>
    <label for="ctEmail">Your email</label>
    <input id="ctEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="ctMsg">Message</label>
    <textarea id="ctMsg" name="message" required rows="6" placeholder="What are you working on?"></textarea>
    <input class="ct-hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="ct-row">
      <button class="cta" id="ctSend" type="submit">Send message</button>
      <span id="ctStatus" role="status" aria-live="polite"></span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Video player">
  <button class="lb-x" type="button" aria-label="Close video">&times;</button>
  <video id="lbv" controls playsinline></video>
</div>

<script>
/* ================= EDIT THIS BLOCK ================= */
const SITE = {
  brand: "35 Labs",
  email: "business.35labs@gmail.com",   // where contact-form messages go
  allowUpload: true,                   // true: show the upload strips (images stay in YOUR browser only). Set false before going live.
  // Permanent strip images: add  images: ["shots/a.jpg","shots/b.jpg"]  to a project below. They show for every visitor.
  intro: "Filmic Rendering, Bold, Colorful",
  // video: path or URL to an .mp4/.webm (short, muted loop). poster: optional still image.
  projects: [
    { client: "Client One",   title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Two",   title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Three", title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Four",  title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Five",  title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Six",   title: "Project Title", video: "", poster: "", href: "#" },
    { client: "Client Seven", title: "Project Title", video: "", poster: "", href: "#" }
  ]
};
/* =================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.title = SITE.brand + "®";
$("brandTop").textContent = SITE.brand;
$("intro").textContent = SITE.intro;
$("mailCta").href = $("mailCta2").href = "#contact";

/* Build the reel (set rendered twice for a seamless loop) */
function cardHTML(p, i){
  const hue = (i * 47 + 20) % 360;
  return `<div class="card">
    <div class="box">
      <a class="link" href="${esc(p.href)}" aria-label="${esc(p.client)}, ${esc(p.title)}">
        <div class="media" data-i="${i}" style="--h:${hue}"></div>
        <div class="cap"><span>${esc(p.client)}</span><span>${esc(p.title)}</span></div></a>
      <div class="vctl" data-i="${i}"></div></div>
    <div class="strip" data-i="${i}"></div></div>`;
}
const set = SITE.projects.map(cardHTML).join("");
$("track").innerHTML = set + set;
$("track").style.setProperty("--dur", SITE.projects.length * 9 + "s");

/* Image strips: add by click or drag & drop; kept in this browser (IndexedDB) */
const files = {}, vfiles = {}, urls = new WeakMap();
const urlOf = b => urls.get(b) || (urls.set(b, URL.createObjectURL(b)), urls.get(b));
const openDB = () => new Promise((ok, no) => {
  const r = indexedDB.open("portfolio-strips", 2);
  r.onupgradeneeded = () => ["s", "v"].forEach(n => r.result.objectStoreNames.contains(n) || r.result.createObjectStore(n));
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
async function save(i){ try { (await openDB()).transaction("s","readwrite").objectStore("s").put(files[i] || [], i); } catch(e){} }
async function loadAll(){
  try {
    const db = await openDB();
    const get = (st, i) => new Promise(ok => {
      const q = db.transaction(st).objectStore(st).get(i);
      q.onsuccess = () => ok(q.result); q.onerror = () => ok();
    });
    await Promise.all(SITE.projects.map(async (_, i) => {
      files[i] = (await get("s", i)) || []; vfiles[i] = (await get("v", i)) || null;
    }));
  } catch(e){}
}
function renderStrip(i){
  const fixed = (SITE.projects[i].images || []).map(s => esc(s));
  const mine = (files[i] || []).map(urlOf);
  const all = fixed.concat(mine), up = SITE.allowUpload;
  document.querySelectorAll(`.strip[data-i="${i}"]`).forEach(el => {
    el.classList.toggle("has", all.length > 0);
    el.classList.toggle("hide", !up && !all.length);
    el.innerHTML = (all.length ? `<div class="imgs">${all.map(s => `<img src="${s}" alt="" loading="lazy">`).join("")}</div>` : "") +
      (up ? `<button class="add" type="button" data-add>${all.length ? "Add images" : "Drop images here or click to add"}</button>` +
        (mine.length ? `<button class="clr" type="button" data-clear>Clear uploads</button>` : "") +
        `<input type="file" accept="image/*" multiple hidden>` : "");
  });
}
async function saveV(i){ try { (await openDB()).transaction("v","readwrite").objectStore("v").put(vfiles[i] || null, i); } catch(e){} }
function renderMedia(i){
  const p = SITE.projects[i], b = vfiles[i], src = b ? urlOf(b) : p.video, up = SITE.allowUpload;
  const html = src
    ? `<video src="${esc(src)}" ${p.poster && !b ? `poster="${esc(p.poster)}"` : ""} muted loop playsinline preload="metadata"></video>`
    : p.poster ? `<img src="${esc(p.poster)}" alt="${esc(p.client)} – ${esc(p.title)}" loading="lazy">` : "";
  document.querySelectorAll(`.media[data-i="${i}"]`).forEach(el => {
    el.innerHTML = html;
    el.querySelectorAll("video").forEach(v => {
      watch(v);
      v.addEventListener("error", () => note(el));
      v.addEventListener("loadedmetadata", () => { if (!v.videoWidth) note(el); });
    });
  });
  document.querySelectorAll(`.vctl[data-i="${i}"]`).forEach(el => {
    el.innerHTML = !up ? "" :
      (src ? `<button type="button" data-vup>Replace video</button>` + (b ? `<button type="button" data-vclear>Remove upload</button>` : "")
           : `<button type="button" class="vempty" data-vup>Drop a video here or click to add</button>`) +
      `<input type="file" accept="${VACCEPT}" hidden>`;
  });
}
/* Any container is accepted; the browser's own decoders decide what can play */
const VEXT = ["mp4","m4v","mov","qt","mkv","webm","avi","mxf","mts","m2ts","ts","wmv","asf","flv","f4v","ogv","ogg","3gp","3g2","mpg","mpeg","m2v","vob","mj2","dv","divx","braw","r3d"];
const VACCEPT = "video/*," + VEXT.map(x => "." + x).join(",");
const MIME = { mp4:"video/mp4", m4v:"video/mp4", mov:"video/quicktime", qt:"video/quicktime", mkv:"video/x-matroska", webm:"video/webm",
  avi:"video/x-msvideo", wmv:"video/x-ms-wmv", asf:"video/x-ms-asf", flv:"video/x-flv", ogv:"video/ogg", ogg:"video/ogg",
  "3gp":"video/3gpp", "3g2":"video/3gpp2", mpg:"video/mpeg", mpeg:"video/mpeg", mts:"video/mp2t", m2ts:"video/mp2t", ts:"video/mp2t", mxf:"application/mxf" };
let toastTimer;
function notify(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 10000);
}
function note(el){
  if (el.querySelector(".vnote")) return;
  el.insertAdjacentHTML("beforeend", '<div class="vnote">This browser can’t play this video’s codec.<br>Re-export it as H.264 MP4.</div>');
}
function probe(blob){
  return new Promise(ok => {
    const v = document.createElement("video"), u = URL.createObjectURL(blob);
    const done = r => { clearTimeout(t); v.removeAttribute("src"); v.load(); URL.revokeObjectURL(u); ok(r); };
    const t = setTimeout(() => done(false), 12000);
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => done(v.videoWidth > 0);
    v.onerror = () => done(false);
    v.src = u;
  });
}
async function addVideo(i, f){
  if (!f) return;
  if (/^(image|audio|text)\//.test(f.type)) return notify("“" + f.name + "” isn’t a video file.");
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  const b = (!f.type || f.type === "application/octet-stream") && MIME[ext] ? new Blob([f], { type: MIME[ext] }) : f;
  if (!(await probe(b)))
    return notify("“" + f.name + "” can’t be played by this browser (unsupported video codec). Re-export it as H.264 MP4, or try Safari on a Mac, which plays more codecs such as ProRes and HEVC.");
  vfiles[i] = b; saveV(i); renderMedia(i);
}
const renderAll = () => SITE.projects.forEach((_, i) => { renderMedia(i); renderStrip(i); });
function addImages(i, list){
  const imgs = [...list].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return;
  files[i] = (files[i] || []).concat(imgs); save(i); renderStrip(i);
}
const track = $("track"), stripOf = e => e.target.closest(".strip");
track.addEventListener("click", e => {
  const s = stripOf(e); if (!s) return;
  if (e.target.closest("[data-add]")) s.querySelector("input").click();
  if (e.target.closest("[data-clear]")) { files[s.dataset.i] = []; save(s.dataset.i); renderStrip(s.dataset.i); }
});
track.addEventListener("change", e => {
  const s = stripOf(e); if (s && e.target.type === "file") addImages(s.dataset.i, e.target.files);
});
track.addEventListener("dragover", e => { const s = stripOf(e); if (s && SITE.allowUpload) { e.preventDefault(); s.classList.add("over"); } });
track.addEventListener("dragleave", e => { const s = stripOf(e); if (s) s.classList.remove("over"); });
track.addEventListener("drop", e => {
  const s = stripOf(e); if (!s || !SITE.allowUpload) return;
  e.preventDefault(); s.classList.remove("over"); addImages(s.dataset.i, e.dataTransfer.files);
});
/* Videos: click the button or drop a video file onto the main box */
track.addEventListener("click", e => {
  const c = e.target.closest(".vctl"); if (!c) return;
  const i = c.dataset.i;
  if (e.target.closest("[data-vup]")) c.querySelector("input").click();
  if (e.target.closest("[data-vclear]")) { vfiles[i] = null; saveV(i); renderMedia(i); }
});
track.addEventListener("change", e => {
  const c = e.target.closest(".vctl"); if (c) addVideo(c.dataset.i, e.target.files[0]);
});
const boxOf = e => e.target.closest(".box");
track.addEventListener("dragover", e => { const b = boxOf(e); if (b && SITE.allowUpload) { e.preventDefault(); b.classList.add("over"); } });
track.addEventListener("dragleave", e => { const b = boxOf(e); if (b) b.classList.remove("over"); });
track.addEventListener("drop", e => {
  const b = boxOf(e); if (!b || !SITE.allowUpload) return;
  e.preventDefault(); b.classList.remove("over");
  addVideo(b.querySelector(".vctl").dataset.i, e.dataTransfer.files[0]);
});

/* Play videos only while visible */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.play().catch(()=>{}); else e.target.pause();
}), { threshold: .25 }) : null;
function watch(v){ if (io) io.observe(v); else v.play().catch(()=>{}); }
renderAll(); loadAll().then(renderAll);

/* Click a video to watch it fullscreen */
const lb = $("lb"), lbv = $("lbv");
function openVideo(src){
  lbv.src = src; lb.hidden = false; document.body.style.overflow = "hidden";
  lbv.play().catch(() => {});
  const rf = lb.requestFullscreen || lb.webkitRequestFullscreen;
  if (rf) { try { const r = rf.call(lb); if (r && r.catch) r.catch(() => {}); } catch(e){} }
  lb.querySelector(".lb-x").focus();
}
function closeVideo(){
  if (lb.hidden) return;
  lbv.pause(); lbv.removeAttribute("src"); lbv.load();
  lb.hidden = true; document.body.style.overflow = "";
  const ef = document.exitFullscreen || document.webkitExitFullscreen;
  if ((document.fullscreenElement || document.webkitFullscreenElement) && ef) { try { ef.call(document); } catch(e){} }
}
track.addEventListener("click", e => {
  const m = e.target.closest(".media"), v = m && m.querySelector("video");
  if (!v) return;
  e.preventDefault(); openVideo(v.currentSrc || v.src);
});
lbv.addEventListener("error", () => { if (lbv.getAttribute("src")) notify("This browser can’t play that video’s codec. Re-export it as H.264 MP4."); });
lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".lb-x")) closeVideo(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeVideo(); });
["fullscreenchange","webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) closeVideo();
}));

/* Contact form: sent to SITE.email through FormSubmit (no server needed); falls back to the visitor's mail app */
const dlg = $("contact"), form = $("ctForm"), stat = $("ctStatus"), sendBtn = $("ctSend");
function openContact(e){
  e.preventDefault(); stat.textContent = ""; stat.className = "";
  dlg.showModal(); document.body.style.overflow = "hidden"; $("ctEmail").focus();
}
[$("mailCta"), $("mailCta2")].forEach(a => a.addEventListener("click", openContact));
dlg.addEventListener("close", () => { document.body.style.overflow = ""; });
dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) dlg.close(); });
form.addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("ctEmail").value.trim(), msg = $("ctMsg").value.trim();
  if (form.elements._honey.value) { form.reset(); return; }          // bot trap
  sendBtn.disabled = true; stat.className = ""; stat.textContent = "Sending…";
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + SITE.email, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ email, _replyto: email, message: msg,
        _subject: "New message from the " + SITE.brand + " website", _template: "table", _captcha: "false" })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || String(d.success) === "false") throw new Error(d.message || "send failed");
    form.reset(); stat.textContent = "Thanks, your message was sent. We’ll reply by email.";
  } catch (err) {
    const a = document.createElement("a");
    a.href = "mailto:" + SITE.email + "?subject=" + encodeURIComponent("Message from the " + SITE.brand + " website") +
             "&body=" + encodeURIComponent(msg + "\n\nReply to: " + email);
    a.textContent = "Send it from your email app";
    stat.className = "err"; stat.textContent = "Couldn’t send from here. "; stat.appendChild(a);
  }
  sendBtn.disabled = false;
});

/* Mobile menu */
const nav = $("nav"), btn = $("menuBtn");
function setMenu(open){
  nav.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open);
  btn.textContent = open ? "Close" : "Menu";
}
btn.addEventListener("click", () => setMenu(!nav.classList.contains("open")));
nav.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
</script>
</body>
</html>
